                contactados[id] = true;
            } else {
                delete contactados[id];
            }
            localStorage.setItem('contactados_la_ligua', JSON.stringify(contactados));
            actualizarContadores();
        }

        function actualizarContadores() {
            const contactados = getContactados();
            const total = PROSPECTOS.length;
            const enviados = Object.keys(contactados).length;

            document.getElementById('counter-pending').textContent = `${pendientes} pendientes`;
            document.getElementById('counter-done').textContent = `${enviados} contactados`;
        }

                    p.direccion.toLowerCase().includes(search)

        function limpiarBusqueda() {
            document.getElementById('searchInput').value = '';
            document.getElementById('clearBtn').classList.add('hidden');

        }

        function copiarMensaje(id) {
            const item = PROSPECTOS.find(p => p.id === id);
            if (item) {
                navigator.clipboard.writeText(item.mensaje).then(() => {
                    mostrarToast("Mensaje de WhatsApp copiado al portapapeles");
                }).catch(() => {
                    const input = document.createElement('textarea');
                    input.value = item.mensaje;
                    document.body.appendChild(input);
                    input.select();
                    document.execCommand('copy');
                    document.body.removeChild(input);
                    mostrarToast("Mensaje de WhatsApp copiado al portapapeles");
                });
            }
        }

        function mostrarToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        renderizar();
