                    <div class="text-center py-10 bg-white rounded-2xl border border-dashed border-slate-300 p-6">
                        <i class="fa-solid fa-filter-circle-xmark text-slate-400 text-3xl mb-2"></i>
                        <p class="text-xs font-bold text-slate-700">No hay negocios con este filtro</p>
                        <p class="text-[11px] text-slate-400 mt-1">Prueba cambiando la comuna o limpiando la búsqueda.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            filtrados.forEach((p, idx) => {
                const isContacted = !!contactados[p.id];
                const badgeColor = p.rubro === 'Gastronomía' ? 'bg-amber-100 text-amber-800' :
                                   p.rubro === 'Turismo' ? 'bg-emerald-100 text-emerald-800' :
                                   p.rubro === 'Textil' ? 'bg-purple-100 text-purple-800' : 'bg-blue-100 text-blue-800';

                html += `
                    <div id="card-${p.id}" class="bg-white rounded-2xl p-4 border border-slate-200/90 shadow-sm transition ${isContacted ? 'card-contacted' : ''}">
                        
                        <!-- HEADER TARJETA -->
                        <div class="flex justify-between items-start gap-2 mb-1.5">
                            <div>
                                <h3 class="text-sm font-bold text-slate-900 leading-tight">${p.nombre}</h3>
                                <div class="flex items-center gap-1.5 mt-0.5">
                                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${badgeColor}">${p.rubro}</span>
                                    <span class="text-[11px] text-slate-500"><i class="fa-solid fa-location-dot text-slate-400 text-[9px]"></i> ${p.comuna}</span>
                                </div>
                            </div>
                            
                            <!-- CHECKBOX CONTACTADO -->
                            <label class="flex items-center gap-1 cursor-pointer bg-slate-50 border border-slate-200 px-2 py-1 rounded-xl text-[10px] shrink-0 font-medium text-slate-600">
                                <input type="checkbox" onchange="toggleContactado('${p.id}', this.checked)" class="rounded text-emerald-600 focus:ring-0 w-3.5 h-3.5" ${isContacted ? 'checked' : ''}>
                                <span>${isContacted ? 'Listo' : 'Marcar'}</span>
                            </label>
                        </div>

                        <!-- DIRECCIÓN & TELÉFONO -->
                        <div class="text-[11px] text-slate-600 space-y-0.5 mb-2.5 bg-slate-50 p-2 rounded-xl border border-slate-100">
                            <div class="flex items-center justify-between">
                                <span><i class="fa-solid fa-map-pin text-slate-400 w-3.5"></i> ${p.direccion}</span>
                                <span class="font-bold text-slate-800"><i class="fa-solid fa-phone text-slate-400 w-3.5"></i> ${p.telefono_formato}</span>
                            </div>
                        </div>

                        <!-- OPORTUNIDAD WEB -->
                        <div class="text-[11px] text-slate-600 leading-relaxed mb-3">
                            <strong class="text-slate-800 text-[10px] uppercase tracking-wider block text-emerald-800">🎯 Propuesta de Valor:</strong>
                            <p class="text-slate-600 mt-0.5">${p.por_que_necesita_web}</p>
                        </div>

                        <!-- ACCIONES DIRECTAS WHATSAPP Y COPIAR -->
                        <div class="grid grid-cols-5 gap-2">
                            <a href="${p.whatsapp_url}" target="_blank" onclick="autoMarcar('${p.id}')" class="col-span-4 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-bold py-2.5 px-3 rounded-xl text-xs flex items-center justify-center gap-2 shadow-sm transition">
                                <i class="fa-brands fa-whatsapp text-base"></i> Abrir WhatsApp Listo
                            </a>
                            <button onclick="copiarMensaje('${p.id}')" title="Copiar mensaje" class="col-span-1 bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 rounded-xl flex items-center justify-center transition border border-slate-200">
                                <i class="fa-regular fa-copy text-sm"></i>
                            </button>
                        </div>

                        <!-- ENLACE DE LA DEMO RECOMENDADA PARA ESTE NEGOCIO -->
                        <div class="mt-2.5 pt-2 border-t border-slate-100 flex items-center justify-between text-[10px] text-slate-500">
                            <span>Demo recomendada:</span>
                            <a href="${p.demo_link}" target="_blank" class="font-bold text-emerald-700 hover:underline flex items-center gap-1">
                                ${p.demo_tipo} en Vivo <i class="fa-solid fa-arrow-up-right-from-square text-[8px]"></i>
                            </a>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            actualizarContadores();
        }

        function toggleContactado(id, status) {
            guardarContactado(id, status);
            const card = document.getElementById(`card-${id}`);
            if (card) {
                if (status) card.classList.add('card-contacted');
                else card.classList.remove('card-contacted');
            }
        }

        function autoMarcar(id) {
            guardarContactado(id, true);
            setTimeout(renderizar, 600);
        }

        function filtrarComuna(comuna) {
            comunaActiva = comuna;
            document.querySelectorAll('.comuna-pill').forEach(btn => {
                btn.classList.remove('bg-slate-900', 'text-white');
                btn.classList.add('bg-white', 'text-slate-700');
            });
            event.target.classList.add('bg-slate-900', 'text-white');
            event.target.classList.remove('bg-white', 'text-slate-700');
            renderizar();
        }

        function filtrarRubro(rubro) {
            rubroActivo = rubro;
            document.querySelectorAll('.rubro-pill').forEach(btn => {
                btn.classList.remove('bg-emerald-700', 'text-white');
                btn.classList.add('bg-white', 'text-slate-700');
            });
            event.target.classList.add('bg-emerald-700', 'text-white');
            event.target.classList.remove('bg-white', 'text-slate-700');
            renderizar();
        }

        function filtrarProspectos() {
            const val = document.getElementById('searchInput').value;
            document.getElementById('clearBtn').classList.toggle('hidden', !val);
            renderizar();
        }

        function limpiarBusqueda() {
            document.getElementById('searchInput').value = '';
            document.getElementById('clearBtn').classList.add('hidden');
            renderizar();
        }

        function copiarMensaje(id) {
            const item = PROSPECTOS.find(p => p.id === id);
            if (item) {
                navigator.clipboard.writeText(item.mensaje).then(() => {
                    mostrarToast("Mensaje de WhatsApp copiado al portapapeles");
                }).catch(() => {
                    const input = document.createElement('textarea');
                    input.value = item.mensaje;
                    document.body.appendChild(input);
                    input.select();
                    document.execCommand('copy');
                    document.body.removeChild(input);
                    mostrarToast("Mensaje de WhatsApp copiado al portapapeles");
                });
            }
        }

        function mostrarToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        // Inicializar al cargar
        renderizar();
    </script>
</body>
</html>
